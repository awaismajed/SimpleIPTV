name: Build SimpleIPTV Android and webOS

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run regression tests
        run: gradle testDebugUnitTest

      - name: Build APK
        run: gradle assembleDebug :tv:assembleDebug

      - name: Version APK filename
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/SimpleIPTV-v4.5.2-beta.apk
          cp tv/build/outputs/apk/debug/tv-debug.apk release/SimpleIPTV-TV-V1.3.apk

      - name: Set up Node.js for webOS packaging
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install webOS CLI
        run: npm install --global @webos-tools/cli

      - name: Generate required webOS icon
        run: echo '' | base64 --decode > webos/icon.png

      - name: Build webOS IPK
        run: |
          ares-package webos -o release
          ls -lh release/*.ipk

      - name: Upload combined Android and webOS package
        uses: actions/upload-artifact@v4
        with:
          name: SimpleIPTV-Android15-webOS-Combined
          path: |
            release/*.apk
            release/*.ipk
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleIPTV-v4.5.2-beta-APK
          path: release/*.apk
